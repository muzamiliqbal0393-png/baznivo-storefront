<html lang="en-PK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="canonical" href="https://baznivo-storefront.vercel.app/shop">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Baznivo">
<meta property="og:title" content="Shop Makeup & Beauty | Baznivo">
<meta property="og:description" content="Browse the full Baznivo makeup catalogue — lipsticks, face, eyes, brushes, skincare and accessories. Cash on delivery all over Pakistan.">
<meta property="og:url" content="https://baznivo-storefront.vercel.app/shop.html">
<meta property="og:image" content="https://baznivo-storefront.vercel.app/assets/img/hero-poster/hero-1.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta property="og:locale" content="en_PK">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Shop Makeup & Beauty | Baznivo">
<meta name="twitter:description" content="Browse the full Baznivo makeup catalogue — lipsticks, face, eyes, brushes, skincare and accessories. Cash on delivery all over Pakistan.">
<meta name="twitter:image" content="https://baznivo-storefront.vercel.app/assets/img/hero-poster/hero-1.jpg">
<!-- /social -->
<meta name="theme-color" content="#33065c">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">

<div id="site-header"></div>

<div class="page-head">
  <div class="container">
    <h1>Shop all products</h1>
    <div class="crumbs"><a href="index.html">Home</a> / <span>Shop</span></div>
  </div>
</div>

<div class="container">
  <div class="shop">
    <details class="filters" id="filters" open aria-label="Filters">
      <summary class="filters__toggle">Filters &amp; sort</summary>
      <h3>Category</h3>
      <div id="filter-cats"></div>

      <div class="filters__group">
        <h3>Price</h3>
        <input class="range" id="filter-price" type="range" min="500" max="4000" step="100" value="4000" aria-label="Maximum price">
        <div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:.4rem">
          <span>Rs 500</span><strong id="price-label" style="color:var(--pink-strong)">Rs 4,000</strong>
        </div>
      </div>

      <div class="filters__group">
        <h3>Need help?</h3>
        <p style="font-size:.85rem;color:var(--muted)">Not sure which option fits you? Message us on WhatsApp and we will help.</p>
        <a class="btn btn--ghost btn--sm" href="contact.html">Contact us</a>
      </div>
    </details>

    <div>
      <div class="shop__bar">
        <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
          <span class="shop__count" id="shop-count">13 products</span>
          <span id="active-filters" style="display:flex;gap:.35rem;flex-wrap:wrap"></span>
        </div>
        <label style="display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--muted)">
          Sort
          <select class="select" id="sort">
            <option value="popular">Best selling</option>
            <option value="new">Newest</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
            <option value="discount">Biggest discount</option>
          </select>
        </label>
      </div>

      <div class="grid-products cols-3" id="shop-grid"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="js/site-config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
