<!DOCTYPE html>
<html lang="en-PK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order confirmed | Baznivo</title>
<meta name="theme-color" content="#33065c">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="order">

<div id="site-header"></div>

<section class="order-hero">
  <div class="container">
    <div class="order-hero__tick">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg>
    </div>
    <h1>Thank you — your order is in</h1>
    <p style="color:var(--muted)">One last step: confirm on WhatsApp so we can dispatch your parcel.</p>
    <div class="order-ref" id="order-ref">Order #</div>
    <p class="form-msg" id="order-send-note" style="max-width:520px;margin:0 auto 1rem"></p>
    <div style="display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap">
      <a class="btn" id="order-wa" href="#" target="_blank" rel="noopener">Confirm on WhatsApp</a>
      <a class="btn btn--ghost" href="shop.html">Continue shopping</a>
    </div>
  </div>
</section>

<section class="section section--tight">
  <div class="container" id="order-wrap" style="max-width:760px">
    <div class="card" id="order-details"></div>
    <div class="card">
      <h3>What happens next?</h3>
      <div class="timeline" id="order-timeline"></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/site-config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
