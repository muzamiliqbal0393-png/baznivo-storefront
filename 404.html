<!DOCTYPE html>
<html lang="en-PK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found (404) | Baznivo</title>
<meta name="theme-color" content="#33065c">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="404">

<div id="site-header"></div>

<section class="order-hero">
  <div class="container">
    <div class="order-hero__tick" style="background:linear-gradient(135deg,var(--purple),var(--pink))">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    </div>
    <h1>We could not find that page</h1>
    <p style="color:var(--muted)">The link may be outdated, or the product is no longer available.</p>
    <div style="display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem">
      <a class="btn" href="shop.html">Browse the shop</a>
      <a class="btn btn--ghost" href="index.html">Home</a>
    </div>
  </div>
</section>

<section class="section section--lilac">
  <div class="container">
    <div class="section-head">
      <h2 class="section-head__title">Popular picks</h2>
    </div>
    <div class="grid-products" id="nf-grid"></div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/site-config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const g = document.getElementById('nf-grid');
    if (g) g.innerHTML = PRODUCTS.slice(0, 4).map(productCard).join('');
    window.watchReveals && window.watchReveals();
  });
</script>
</body>
</html>
